name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          # plugin-kit 10 needs Node >= 24; pinned to match publish.yml
          node-version: 24
      - run: npm clean-install
      - run: npx oxfmt --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Runs plugin-kit verify-package and pkg-utils build --strict --check
      - run: npm run build
      # The packed package.json must not point at src/ (see scripts/publish-exports.mjs)
      - run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/*.tgz -C "$RUNNER_TEMP" package/package.json
          node scripts/publish-exports.mjs check "$RUNNER_TEMP/package/package.json"
          git diff --exit-code package.json

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm clean-install
      - run: npx playwright install --with-deps chromium
      # Starts the dev Studio against a mocked Content Lake (e2e/mock-api.ts)
      - run: npm run test:e2e
